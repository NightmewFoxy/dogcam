<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dog Cam">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Dog Cam</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px -apple-system, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  video.fill { object-fit: cover; }
  button.on { background: rgba(255,190,70,.85); color: #000; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(0,0,0,.55); }
  #msg.hide { display: none; }
  #msg p { margin: 0; max-width: 22em; line-height: 1.4; }
  #msg small { opacity: .7; }
  .spin { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite; }
  .spin.off { display: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 14px 10px calc(14px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: #fff; background: rgba(40,40,40,.75); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 12px 15px; min-width: 50px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  button:active { background: rgba(90,90,90,.8); }
  #live { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 14px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(200,30,30,.9); display: none; }
  #live.on { display: block; }
  input { font: inherit; width: 100%; max-width: 22em; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #111; color: #fff; }
</style>
</head>
<body>
<video id="v" playsinline webkit-playsinline muted autoplay></video>
<audio id="a" playsinline></audio>
<div id="live">● LIVE</div>
<div id="msg"><div class="spin" id="spin"></div><p id="text">Waking the camera…</p><div id="extra"></div></div>
<div id="bar">
  <button id="sound" aria-label="Sound">🔇 Sound off</button>
  <button id="lamp" aria-label="Light the room with the Mac screen">💡 Lamp</button>
  <button id="night" aria-label="Night picture">🌙 Night</button>
  <button id="fill" aria-label="Fill the screen">⤢</button>
  <button id="again" aria-label="Reload">↻</button>
</div>
<script>
(() => {
  const KEY = 'dogcam';
  const v = document.getElementById('v');
  const msg = document.getElementById('msg'), text = document.getElementById('text'), spin = document.getElementById('spin'), extra = document.getElementById('extra');
  const live = document.getElementById('live'), sound = document.getElementById('sound'), again = document.getElementById('again');
  const store = { get: () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } }, set: (c) => { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} } };
  const parse = (s) => { const m = /([a-z0-9-]{10,80})\.([a-f0-9]{16,80})\s*$/i.exec(String(s || '')); return m ? { topic: m[1], token: m[2] } : null; };

  // The link from the Mac carries the key after the # (it never leaves the phone); it is kept for next time.
  let cfg = parse(location.hash.slice(1));
  if (cfg) store.set({ ...(store.get() || {}), ...cfg }); else cfg = store.get();

  const say = (t, busy, more) => { text.textContent = t; spin.className = busy ? 'spin' : 'spin off'; extra.innerHTML = more || ''; msg.className = ''; live.className = ''; };
  const get = async (url, ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); try { return await fetch(url, { signal: c.signal, cache: 'no-store' }); } finally { clearTimeout(t); } };

  async function lookUp() {
    const r = await get(`https://ntfy.sh/${cfg.topic}/json?poll=1&since=12h`, 12000);
    let base = null;
    for (const line of (await r.text()).split('\n')) {
      try { const o = JSON.parse(line); if (o.event === 'message' && /^dog: https:\/\//.test(o.message)) base = o.message.slice(5).trim(); } catch {}
    }
    return base;
  }
  async function answers(base) {
    try { const r = await get(`${base}/${cfg.token}/status`, 8000); if (r.status === 404) return 'key'; return r.ok ? await r.json() : null; } catch { return null; }
  }

  let run = 0, watch = null, pc = null, ear = null, lastT = 0, lastMove = 0, hearing = false;
  const aud = document.getElementById('a');
  // Live like a video call (14 Oct 2026): WebRTC straight from the Mac. The picture comes by itself (measured: held
  // ~40 ms on the phone), because a phone keeps picture and sound in step, and the Mac's sound arrives later: together,
  // the picture was held back ~100-400 ms. Sound, when switched on, is a second call of its own (~120 ms).
  // Only if WebRTC cannot connect, the Mac's low-latency HLS (1-2 s behind, picture and sound together) is played.
  const ICE = [{ urls: 'stun:stun.cloudflare.com:3478' }, { urls: 'stun:stun.l.google.com:19302' }];
  function hangUp() { if (pc) { try { pc.close(); } catch {} pc = null; } if (ear) { try { ear.close(); } catch {} ear = null; } }
  // One WebRTC call to the Mac for one kind ('video' or 'audio'); returns the connection once the answer is in.
  async function dial(base, kind, onTrack) {
    const c = new RTCPeerConnection({ iceServers: ICE, bundlePolicy: 'max-bundle' });
    c.addTransceiver(kind, { direction: 'recvonly' });
    c.ontrack = (e) => { try { e.receiver.jitterBufferTarget = 0; } catch {} onTrack(e.track); };
    await c.setLocalDescription(await c.createOffer());
    // (the phone's own outside address must be in the offer, or the home router may drop the picture: wait for it)
    await new Promise((r) => { if (c.iceGatheringState === 'complete') return r(); c.addEventListener('icegatheringstatechange', () => { if (c.iceGatheringState === 'complete') r(); }); setTimeout(r, 2500); });
    const r = await fetch(`${base}/${cfg.token}/whep`, { method: 'POST', headers: { 'content-type': 'application/sdp' }, body: c.localDescription.sdp, cache: 'no-store' });
    if (!r.ok) { c.close(); throw new Error(`whep ${r.status}`); }
    // (the Mac names picture and sound as one stream, and a phone keeps one stream in step even across two calls:
    // the sound gets a name of its own, so the picture is never held back for it)
    let sdp = await r.text();
    if (kind === 'audio') sdp = sdp.replace(/^(a=(?:ssrc:\d+ )?msid:)\S+/gm, '$1dogsound').replace(/^(a=ssrc:\d+ mslabel:)\S+/gm, '$1dogsound');
    await c.setRemoteDescription({ type: 'answer', sdp });
    return c;
  }
  async function call(base, me) {
    hangUp();
    v.removeAttribute('src'); v.muted = true;
    const c = await dial(base, 'video', (t) => { v.srcObject = new MediaStream([t]); v.play().catch(() => {}); });
    if (me !== run) { c.close(); return false; }
    pc = c;
    if (hearing) listen(base, me);
    for (let i = 0; i < 40 && me === run; i++) {
      if (c.connectionState === 'connected' && v.readyState >= 2) return true;
      if (c.connectionState === 'failed') return false;
      await new Promise((r) => setTimeout(r, 250));
    }
    return false;
  }
  async function frames() {
    if (!pc) return v.currentTime;
    let n = 0; try { (await pc.getStats()).forEach((s) => { if (s.type === 'inbound-rtp' && s.kind === 'video') n = s.framesDecoded || 0; }); } catch {}
    return n;
  }
  async function start() {
    const me = ++run;
    clearInterval(watch);
    if (!cfg) return say('Paste the Dog Cam link from the Mac.', false, '<input id="link" placeholder="Paste the link here" autocapitalize="off" autocorrect="off">');
    say('Waking the camera…', true);
    let base = (store.get() || {}).base, st = base ? await answers(base) : null;
    if (!st || st === 'key') {
      try { const b = await lookUp(); if (b) { base = b; st = await answers(b); } } catch {}
    }
    if (me !== run) return;
    if (st === 'key') return say('This link no longer matches the Mac. Ask for a new Dog Cam link.', false);
    if (!st) return say('The Mac is not answering.', false, '<small>It may be off, asleep or without internet. Trying again…</small>'), void setTimeout(() => { if (me === run) start(); }, 8000);
    store.set({ ...cfg, base });
    sound.style.display = st.sound ? '' : 'none';
    document.getElementById('lamp').classList.toggle('on', !!st.lamp); document.getElementById('night').classList.toggle('on', !!st.night);
    // (the camera takes a few seconds to come on; the page connects once its picture has reached the Mac's relay)
    for (let i = 0; i < 40; i++) {
      let w = null;
      try { const r = await get(`${base}/${cfg.token}/wake`, 8000); w = r.ok ? await r.json() : null; } catch {}
      if (me !== run) return;
      if (w && w.ready) break;
      if (w && w.error) say('The Mac camera is not giving a picture.', true, `<small>${w.error.replace(/[<&]/g, '')}<br>Is the Mac's lid open? Trying again…</small>`);
      await new Promise((r) => setTimeout(r, 500));
      if (me !== run) return;
    }
    let ok = false;
    try { ok = await call(base, me); } catch {}
    if (me !== run) return;
    if (!ok) { hangUp(); v.srcObject = null; v.muted = !hearing; v.src = `${base}/${cfg.token}/hls/index.m3u8`; v.play().catch(() => {}); }
    lastT = -1; lastMove = Date.now();
    let tick = 0;
    // (every 1.5 s: is the picture still moving? every 6 s: tell the Mac someone is still watching. A picture that
    // stops for 6 s, or a call that drops, is connected again; a camera error is shown as the Mac says it)
    watch = setInterval(async () => {
      if (me !== run || document.hidden) return;
      if (++tick % 4 === 0) get(`${base}/${cfg.token}/wake`, 8000).catch(() => {});
      const n = await frames();
      if (me !== run) return;
      if (n !== lastT) { lastT = n; lastMove = Date.now(); if (n > 0) { msg.className = 'hide'; live.className = 'on'; } return; }
      if (Date.now() - lastMove < (pc && pc.connectionState !== 'failed' ? 6000 : 12000)) return;
      const s = await answers(base);
      if (me !== run) return;
      if (s && s !== 'key' && s.error) say('The Mac camera is not giving a picture.', true, `<small>${s.error.replace(/[<&]/g, '')}<br>Is the Mac's lid open? Trying again…</small>`);
      start();
    }, 1500);
  }
  function stop() { run++; clearInterval(watch); hangUp(); aud.pause(); aud.srcObject = null; v.pause(); v.srcObject = null; v.removeAttribute('src'); v.load(); live.className = ''; }

  // Sound: its own call (WebRTC), or the HLS player's own sound in the fallback.
  async function listen(base, me) {
    if (ear) { try { ear.close(); } catch {} ear = null; }
    try { const c = await dial(base, 'audio', (t) => { aud.srcObject = new MediaStream([t]); aud.play().catch(() => {}); }); if (me !== run || !hearing) c.close(); else ear = c; } catch {}
  }
  sound.onclick = () => {
    hearing = !hearing; sound.textContent = hearing ? '🔊 Sound on' : '🔇 Sound off';
    if (!pc) { v.muted = !hearing; if (hearing) v.play().catch(() => {}); return; }
    v.muted = true;
    // (the tap itself lets the sound play: iPhone allows sound only from a tap)
    if (hearing) { aud.muted = false; aud.play().catch(() => {}); const c = store.get() || {}; if (c.base) listen(c.base, run); } else { aud.pause(); if (ear) { try { ear.close(); } catch {} ear = null; } aud.srcObject = null; }
  };
  again.onclick = () => start();
  // (a dark room: the phone brightens the picture itself; kept for next time, like the fill-the-screen choice)
  const keep = (id, cls) => { const b = document.getElementById(id); const k = "dogcam-" + cls; const set = (on) => { v.classList.toggle(cls, on); b.classList.toggle("on", on); try { localStorage.setItem(k, on ? "1" : ""); } catch {} }; let was = false; try { was = !!localStorage.getItem(k); } catch {} set(was); b.onclick = () => set(!v.classList.contains(cls)); };
  keep("fill", "fill");
  // Dark room: "Lamp" makes the Mac's screen a white light for the room, "Night" has the Mac clean and brighten the
  // picture before sending it (the stream starts again, about 10 s). Both go off on the Mac when the page is closed.
  const lampB = document.getElementById("lamp"), nightB = document.getElementById("night");
  const ask = async (what) => { const c = store.get() || {}; if (!c.base) return null; try { const r = await get(c.base + "/" + cfg.token + "/" + what, 10000); return r.ok ? await r.json() : null; } catch { return null; } };
  lampB.onclick = async () => { const on = !lampB.classList.contains("on"); lampB.classList.toggle("on", on); const r = await ask(on ? "lampon" : "lampoff"); if (!r) lampB.classList.toggle("on", !on); };
  nightB.onclick = async () => { const on = !nightB.classList.contains("on"); nightB.classList.toggle("on", on); run++; clearInterval(watch); say(on ? "Switching to the night picture…" : "Switching to the normal picture…", true); const r = await ask(on ? "nighton" : "nightoff"); if (!r) nightB.classList.toggle("on", !on); start(); };
  document.addEventListener('change', (e) => { if (e.target.id !== 'link') return; const c = parse(e.target.value.split('#').pop()); if (c) { cfg = c; store.set(c); start(); } else say('That is not a Dog Cam link.', false, '<input id="link" placeholder="Paste the link here" autocapitalize="off" autocorrect="off">'); });
  // (leaving the page stops the stream, so the Mac's camera turns itself off)
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted) start(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  start();
})();
</script>
</body>
</html>
